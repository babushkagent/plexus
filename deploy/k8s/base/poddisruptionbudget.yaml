apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: plexus-api
  labels:
    app.kubernetes.io/name: plexus
    app.kubernetes.io/component: api
spec:
  # One replica can be drained for a node upgrade; two cannot, which is how the
  # control plane keeps answering during a rolling cluster maintenance window.
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plexus
      app.kubernetes.io/component: api

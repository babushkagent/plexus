# Latency-bound: scales on request rate (see hpa.yaml). Deliberately free of any
# batch work so a large enqueue can never starve an inference request of CPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plexus-api
  labels:
    app.kubernetes.io/name: plexus
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plexus
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plexus
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: plexus
      # Must exceed PLEXUS_SHUTDOWN_GRACE_S (30s default): SIGTERM drains in-flight
      # requests, and /readyz flips to 503 first so the Service stops sending more.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: plexus
                    app.kubernetes.io/component: api
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: plexus
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: plexus:0.1.0
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: plexus-config
            - secretRef:
                name: plexus-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # HOME for the non-root user; nothing else needs to be writable.
            - name: home
              mountPath: /var/lib/plexus
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Liveness never touches Postgres, so a database outage makes the pod
          # unready rather than restarting it into a crashloop.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: home
          emptyDir: {}

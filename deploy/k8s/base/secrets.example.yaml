# Reference only -- never commit real values, and never add this to the kustomization.
# Prefer an external store (Sealed Secrets, External Secrets, SOPS) in git.
apiVersion: v1
kind: Secret
metadata:
  name: plexus-secrets
type: Opaque
stringData:
  PLEXUS_JWT_SECRET: "replace-me-with-at-least-32-characters"
  PLEXUS_API_KEY_PEPPER: "replace-me-pepper"
  PLEXUS_DATABASE_URL: "postgresql://plexus_app:PASSWORD@pg-rw.database.svc.cluster.local:5432/plexus"
  OPENAI_API_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: plexus-postgres
type: Opaque
stringData:
  connection-string: "postgresql://plexus_app:PASSWORD@pg-rw.database.svc.cluster.local:5432/plexus"

# Generated shape mirrors plexus.scaling.autoscaler.render_hpa(): fast scale-up,
# slow scale-down, so a fleet does not oscillate around its target.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: plexus-api
  labels:
    app.kubernetes.io/name: plexus
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: plexus-api
  minReplicas: 2
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
